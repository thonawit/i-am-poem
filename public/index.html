<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>I Am Poem</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <h1>I Am Poem</h1>
    <p class="subtitle">Same prompt, any model — see who writes it best.</p>

    <section id="key-section">
      <label for="ollama-key">Ollama API key</label>
      <div class="row">
        <input id="ollama-key" type="password" placeholder="Paste your Ollama API key" autocomplete="off" />
        <button id="save-ollama-key" data-provider="ollama">Save</button>
      </div>
      <p class="hint">Get one at <code>ollama.com/settings/keys</code>.</p>
      <p id="ollama-key-status" class="status"></p>

      <label for="openrouter-key">OpenRouter API key</label>
      <div class="row">
        <input id="openrouter-key" type="password" placeholder="Paste your OpenRouter API key" autocomplete="off" />
        <button id="save-openrouter-key" data-provider="openrouter">Save</button>
      </div>
      <p class="hint">Get one at <code>openrouter.ai/settings/keys</code>. Only needed if you pick an OpenRouter model below.</p>
      <p id="openrouter-key-status" class="status"></p>

      <p class="hint">Keys are saved to a local <code>.env</code> file on this machine and sent only to the
      provider they belong to.</p>
    </section>

    <form id="poem-form">
      <label for="subject">What is the subject of your poem?</label>
      <input id="subject" required />

      <label for="style">What type of style?</label>
      <select id="style" required></select>

      <label for="context">Context (optional)</label>
      <textarea id="context" rows="3"></textarea>

      <label for="model">Model</label>
      <select id="model" required></select>
      <p id="model-provider-hint" class="hint"></p>

      <button id="generate" type="submit">Generate</button>
    </form>

    <section id="output" class="output hidden">
      <h2 id="output-title"></h2>
      <pre id="output-poem"></pre>
      <p id="output-model" class="status"></p>
      <p id="output-usage" class="status"></p>
    </section>

    <p id="error" class="error hidden"></p>
  </main>

  <script src="app.js"></script>
</body>
</html>
